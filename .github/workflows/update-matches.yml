name: Update match data

# 公开仓库 + 每小时采集一次。
# 数据不再提交到 Git：每次先恢复 Release 资产里的上一份快照，采集合并后再覆盖上传，
# 因此仓库历史里不会累积 1.3 MB 的赛事数据。小程序是构建时打包数据，不需要分钟级新鲜度。
# 每轮至少 30 次请求（15 个游戏 × upcoming/past），含翻页通常约 33 次。
# 需要在仓库 Secrets 配置：
#   PANDASCORE_TOKEN（必填）、LIQUIPEDIA_API_KEY（可选）
#   LIQUIPEDIA_CONTACT（可选，填邮箱或主页，Liquipedia 要求 UA 带联系方式）
# 注意：GitHub 的定时任务在高峰期可能延迟；公开仓库连续 60 天无仓库活动会被暂停计划任务，
# 由 keepalive.yml 每月提交一次时间戳保活。
# Liquipedia 可能屏蔽数据中心 IP，失败时看日志，PandaScore 不受影响。

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view data >/dev/null 2>&1; then
            gh release download data --pattern matches.json --dir data --clobber \
              || echo "release 存在但还没有 matches.json 资产，从空数据开始"
          else
            echo "首次运行：还没有 data release，从空数据开始"
          fi

      - name: Collect matches
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: node tools/fetch-matches.mjs --days=10 --retention=45

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "赛事数据" --notes "由 GitHub Actions 自动更新，请勿手动编辑。"
          gh release upload data data/matches.json --clobber
