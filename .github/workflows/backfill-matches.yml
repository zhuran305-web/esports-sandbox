name: Backfill match data

# 每天 UTC 03:00（北京 11:00）回填前后各 30 天赛程，供「赛程表」子页面检索。
# 过去最多 40 页（约 2000 场）、未来 10 页；CS2 过去 30 天约 1447 场（29 页）、未来约 371 场（8 页）。
# 与 update-matches 共用 concurrency group，避免同时读写同一份快照。
# 数据不提交到 Git，而是覆盖 Release 资产 `data` 下的 matches.json。
# 需要仓库 Secrets：PANDASCORE_TOKEN（必填）、LIQUIPEDIA_API_KEY / LIQUIPEDIA_CONTACT（可选）。

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view data >/dev/null 2>&1; then
            gh release download data --pattern matches.json --dir data --clobber \
              || echo "release 存在但还没有 matches.json 资产，从空数据开始"
            # 队伍 id 映射（1.3.2 选手阵容）：可选资产，缺失时从空累积
            gh release download data --pattern team-ids.json --dir data --clobber \
              || echo "还没有 team-ids.json 资产，从空累积"
            # Pick'Em 赛事聚合（1.4.0）：可选资产，缺失时从空累积
            gh release download data --pattern pickem.json --dir data --clobber \
              || echo "还没有 pickem.json 资产，从空累积"
          else
            echo "首次运行：还没有 data release，从空数据开始"
          fi

      - name: Backfill one month
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
        run: node tools/fetch-matches.mjs --days=30 --past-days=30 --past-pages=40 --upcoming-pages=10 --retention=45

      # 战队选手阵容（1.3.2）：按窗口内队伍的 PandaScore id 拉花名册，OSS 累积缓存增量抓取。
      # 零外部依赖（纯 node fetch）；失败仅少阵容不阻塞数据；--window-reads-match 从 matches.json 取窗口队伍
      - name: Fetch team rosters
        continue-on-error: true
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          if [ ! -f data/team-ids.json ]; then
            echo "还没有 team-ids.json（旧资产），本轮先靠本轮采集累积，下一轮回填生效"
            exit 0
          fi
          node tools/fetch-team-rosters.mjs --oss --window

      # Pick'Em 赛事聚合（1.4.0）：纯本地聚合（matches.json + 配置），零外部依赖；
      # continue-on-error 显式声明——任何问题都不阻塞数据发布
      - name: Fetch pickem events
        continue-on-error: true
        run: node tools/fetch-pickem.mjs

      - name: Build runtime data
        run: node tools/build-runtime-data.mjs

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "赛事数据" --notes "由 GitHub Actions 自动更新，请勿手动编辑。"
          cp runtime/matches.json "$RUNNER_TEMP/runtime-matches.json"
          cp runtime/meta.json "$RUNNER_TEMP/runtime-meta.json"
          gh release upload data data/matches.json "$RUNNER_TEMP/runtime-matches.json" "$RUNNER_TEMP/runtime-meta.json" --clobber
          # 队伍 id 映射（1.3.2）：本轮采集有累积就上传
          if [ -f data/team-ids.json ]; then
            gh release upload data data/team-ids.json --clobber
          fi
          # Pick'Em 赛事聚合（1.4.0）：同 team-ids 先例
          if [ -f data/pickem.json ]; then
            gh release upload data data/pickem.json --clobber
          fi

      # 2026-10-25 事故修复：backfill 曾只上传 Release 不更新 OSS，导致 OSS 与 Release
      # 脱节后，update-matches 以 Release 为基准的变化检测永远「无变化」，OSS 长时间停更。
      - name: Publish runtime data to OSS
        if: env.OSS_ACCESS_KEY_ID != ''
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: node tools/publish-runtime-oss.mjs --upload --check
