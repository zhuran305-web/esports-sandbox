name: Refresh live data

# live.json 高频刷新（2026-11-11）：进行中/刚完赛场次的独立小文件（几 KB），
# 由 FC 每 10 分钟 dispatch（esports-sandbox-cron/dispatch 的 every10 触发器分支）。
# 与 update-matches 完全解耦：不 Restore/不上 Release/不碰 matches.json 整包——
# 单写者（只有本 workflow 写 live.json）+ 独立 concurrency group，零互扰。
# 数据源：全局 /matches/running（1 次）+ /matches/past?sort=-end_at（1 次），零依赖免 npm ci。
# 消费端：小程序 1.3.16 起轻量轮询 live.json（存在 lv 场次才拉，2.5 分钟一次）；
#         旧版客户端不认识 live.json，零影响。
# 配额：2 次/轮 × 6 轮/小时 = 12 次/小时（占 1.2%）。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and publish live.json
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: node tools/publish-live-oss.mjs

      # 失败告警（FC dispatch 失败只记日志——alertIf 在 handler 中此分支不可用，这里补通知）
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
          ALERT_WORKFLOW_FILE: refresh-live.yml
          GH_TOKEN: ${{ github.token }}
        run: node tools/alert-notify.mjs --title "【赛事沙盘】live 刷新失败" --body "refresh-live workflow 失败（live.json 停更，客户端实时比分退化到 15 分钟整包节奏）：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
