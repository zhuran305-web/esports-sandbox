name: Backfill match data

# 每天 UTC 03:00（北京 11:00）回填前后各 30 天赛程，供「赛程表」子页面检索。
# 过去最多 40 页（约 2000 场）、未来 10 页；CS2 过去 30 天约 1447 场（29 页）、未来约 371 场（8 页）。
# 与 update-matches 共用 concurrency group，避免同时读写同一份快照。
# 数据不提交到 Git，而是覆盖 Release 资产 `data` 下的 matches.json。
# 需要仓库 Secrets：PANDASCORE_TOKEN（必填）、LIQUIPEDIA_API_KEY / LIQUIPEDIA_CONTACT（可选）。

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view data >/dev/null 2>&1; then
            gh release download data --pattern matches.json --dir data --clobber \
              || echo "release 存在但还没有 matches.json 资产，从空数据开始"
            # 队伍 id 映射（1.3.2 选手阵容）：可选资产，缺失时从空累积
            gh release download data --pattern team-ids.json --dir data --clobber \
              || echo "还没有 team-ids.json 资产，从空累积"
            # Pick'Em 赛事聚合（1.4.0）：可选资产，缺失时从空累积
            gh release download data --pattern pickem.json --dir data --clobber \
              || echo "还没有 pickem.json 资产，从空累积"
            # 赛事结构（2026-11-10）：可选资产，缺失时从空累积
            gh release download data --pattern tournament-structures.json --dir data --clobber \
              || echo "还没有 tournament-structures.json 资产，从空累积"
            # incidents 游标（2026-11-10）：可选资产，缺失时首轮只建游标不发警告
            gh release download data --pattern incidents-cursor.json --dir data --clobber \
              || echo "还没有 incidents-cursor.json 资产，从空累积"
            # 选手变更游标（2026-11-11）：可选资产，缺失时首轮只建游标
            gh release download data --pattern player-cursor.json --dir data --clobber \
              || echo "还没有 player-cursor.json 资产，从空累积"
          else
            echo "首次运行：还没有 data release，从空数据开始"
          fi

      - name: Backfill one month
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
        run: node tools/fetch-matches.mjs --days=30 --past-days=30 --past-pages=40 --upcoming-pages=10 --retention=45

      # incidents 对账（2026-11-10）：官方增/删/改增量流，漏抓/删除对账告警（游标推进）。
      # 需要 Backfill 产出的 matches.json；continue-on-error 显式声明——对账失败不阻塞数据发布
      - name: Fetch incidents
        continue-on-error: true
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: node tools/fetch-incidents.mjs

      # 战队选手阵容（1.3.2）：按窗口内队伍的 PandaScore id 拉花名册，OSS 累积缓存增量抓取。
      # 零外部依赖（纯 node fetch）；失败仅少阵容不阻塞数据；--window-reads-match 从 matches.json 取窗口队伍
      - name: Fetch team rosters
        continue-on-error: true
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          if [ ! -f data/team-ids.json ]; then
            echo "还没有 team-ids.json（旧资产），本轮先靠本轮采集累积，下一轮回填生效"
            exit 0
          fi
          node tools/fetch-team-rosters.mjs --oss --window

      # 赛事结构抓取（2026-11-10）：需要刚更新的 matches.json（取 tid）；continue-on-error 显式声明
      # ——结构数据缺失只退化到旧推导路径，绝不阻塞数据发布
      - name: Fetch tournament structures
        continue-on-error: true
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: node tools/fetch-tournament-structures.mjs

      # Pick'Em 赛事聚合（1.4.0）：纯本地聚合（matches.json + 配置），零外部依赖；
      # continue-on-error 显式声明——任何问题都不阻塞数据发布
      - name: Fetch pickem events
        continue-on-error: true
        run: node tools/fetch-pickem.mjs

      - name: Build runtime data
        run: node tools/build-runtime-data.mjs

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "赛事数据" --notes "由 GitHub Actions 自动更新，请勿手动编辑。"
          cp runtime/matches.json "$RUNNER_TEMP/runtime-matches.json"
          cp runtime/meta.json "$RUNNER_TEMP/runtime-meta.json"
          gh release upload data data/matches.json "$RUNNER_TEMP/runtime-matches.json" "$RUNNER_TEMP/runtime-meta.json" --clobber
          # 队伍 id 映射（1.3.2）：本轮采集有累积就上传
          if [ -f data/team-ids.json ]; then
            gh release upload data data/team-ids.json --clobber
          fi
          # Pick'Em 赛事聚合（1.4.0）：同 team-ids 先例
          if [ -f data/pickem.json ]; then
            gh release upload data data/pickem.json --clobber
          fi
          # 赛事结构（2026-11-10）：同 team-ids 先例
          if [ -f data/tournament-structures.json ]; then
            gh release upload data data/tournament-structures.json --clobber
          fi
          # incidents 游标（2026-11-10）：同 team-ids 先例
          if [ -f data/incidents-cursor.json ]; then
            gh release upload data data/incidents-cursor.json --clobber
          fi
          # 选手变更游标（2026-11-11）：同 team-ids 先例
          if [ -f data/player-cursor.json ]; then
            gh release upload data data/player-cursor.json --clobber
          fi
          # 战队阵容缓存（1.3.2）：权威累积在 OSS，这里回传一份 Release 副本供 update-matches 恢复
          # （2026-11-11 修：此前不是资产生成方，update-matches 无从恢复 → 每小时清空线上阵容切片）
          if [ -f data/team-rosters.json ]; then
            gh release upload data data/team-rosters.json --clobber
          fi

      # 2026-10-25 事故修复：backfill 曾只上传 Release 不更新 OSS，导致 OSS 与 Release
      # 脱节后，update-matches 以 Release 为基准的变化检测永远「无变化」，OSS 长时间停更。
      - name: Publish runtime data to OSS
        if: env.OSS_ACCESS_KEY_ID != ''
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: node tools/publish-runtime-oss.mjs --upload --check

      # 失败告警（2026-11-08）：每日回填失败 webhook 通知（回填负责 45 天窗口与花名册累积，
      # 停摆会造成数据面缺口）。未配置 ALERT_WEBHOOK_URL 时静默跳过；频控见 tools/alert-notify.mjs
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
          ALERT_WORKFLOW_FILE: backfill-matches.yml
          GH_TOKEN: ${{ github.token }}
        run: node tools/alert-notify.mjs --title "【赛事沙盘】每日回填失败" --body "backfill-matches workflow 失败（45 天窗口/花名册累积停摆）：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
