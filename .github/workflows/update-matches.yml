name: Update match data

# 公开仓库 + 每 5 分钟采集一次（GitHub Actions 的最短间隔）。
# 数据不提交到 Git：每次先恢复 Release 资产里的上一份快照，采集合并后只有内容变化才覆盖上传，
# 因此仓库体积不会增长。小程序仍是构建时打包数据，用户端要看到新赛程需重新构建发布。
# 每轮至少 30 次请求（15 个游戏 × upcoming/past），含翻页通常约 33 次；12 轮/小时约 396 次，占额度 40%。
# 需要在仓库 Secrets 配置：
#   PANDASCORE_TOKEN（必填）、LIQUIPEDIA_API_KEY（可选）
#   LIQUIPEDIA_CONTACT（可选，填邮箱或主页，Liquipedia 要求 UA 带联系方式）
#   OSS_BUCKET / OSS_REGION / OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（可选）
#     —— 配齐后每次数据变化会同步 runtime 数据到 OSS，供小程序运行时拉取；
#        未配置时该步骤自动跳过，行为与以前一致。OSS_PREFIX 可选（对象前缀）。
# 注意：GitHub 的定时任务在高峰期可能延迟；公开仓库连续 60 天无仓库活动会被暂停计划任务，
# 由 keepalive.yml 每月提交一次时间戳保活。
# Liquipedia 可能屏蔽数据中心 IP，失败时看日志，PandaScore 不受影响。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_REGION: ${{ secrets.OSS_REGION }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore previous snapshot
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view data >/dev/null 2>&1; then
            gh release download data --pattern matches.json --dir data --clobber \
              || echo "release 存在但还没有 matches.json 资产，从空数据开始"
          else
            echo "首次运行：还没有 data release，从空数据开始"
          fi
          if [ -f data/matches.json ]; then
            cp data/matches.json "$RUNNER_TEMP/matches.previous.json"
            echo "has_previous=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect matches
        id: collect
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: |
          node tools/fetch-matches.mjs --days=10 --retention=45
          if [ "${{ steps.restore.outputs.has_previous }}" = "true" ] && cmp -s "$RUNNER_TEMP/matches.previous.json" data/matches.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过 Release 上传"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build runtime data
        if: steps.collect.outputs.changed == 'true'
        run: node tools/build-runtime-data.mjs

      - name: Publish snapshot
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "赛事数据" --notes "由 GitHub Actions 自动更新，请勿手动编辑。"
          cp runtime/matches.json "$RUNNER_TEMP/runtime-matches.json"
          cp runtime/meta.json "$RUNNER_TEMP/runtime-meta.json"
          gh release upload data data/matches.json "$RUNNER_TEMP/runtime-matches.json" "$RUNNER_TEMP/runtime-meta.json" --clobber

      - name: Publish runtime data to OSS
        if: steps.collect.outputs.changed == 'true' && env.OSS_ACCESS_KEY_ID != ''
        run: node tools/publish-runtime-oss.mjs --upload --check
