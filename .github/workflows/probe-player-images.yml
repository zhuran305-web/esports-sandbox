name: Probe PandaScore player images

# 临时探针（用后即删）：核实 /players 系端点的 image_url 覆盖率是否高于 /teams/{id} 内嵌 players
# （现行 roster 管线只采 teams 内嵌，CS2 实测覆盖率 ~21%）。只读 GET，消耗配额 <10 次。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe player image fields
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: |
          echo "== 1) /players/35905（donk——teams 端点无图的样本）=="
          curl -s --max-time 20 -H "Authorization: Bearer $PANDASCORE_TOKEN" \
            "https://api.pandascore.co/players/35905" \
            | jq '{id, name, image_url, first_name, last_name, team: .current_team.name, videogame: .current_videogame.name}'
          echo ""
          echo "== 2) /players/23237（sh1ro——teams 端点有图的对照样本）=="
          curl -s --max-time 20 -H "Authorization: Bearer $PANDASCORE_TOKEN" \
            "https://api.pandascore.co/players/23237" \
            | jq '{id, name, image_url, team: .current_team.name}'
          echo ""
          echo "== 3) /csgo/players?per_page=100 按 modified_at 取 100 名，image_url 非空率 =="
          curl -s --max-time 25 -H "Authorization: Bearer $PANDASCORE_TOKEN" \
            "https://api.pandascore.co/csgo/players?per_page=100&sort=-modified_at" \
            | jq '{sample: length, with_image: [.[] | select(.image_url != null and .image_url != "")] | length}'
          echo ""
          echo "== 4) 同 100 名里抽 5 个无图者，看 /players/{id} 单查是否给出 image_url =="
          IDS=$(curl -s --max-time 25 -H "Authorization: Bearer $PANDASCORE_TOKEN" \
            "https://api.pandascore.co/csgo/players?per_page=100&sort=-modified_at" \
            | jq -r '[.[] | select(.image_url == null or .image_url == "")][0:5][].id' | tr '\n' ' ')
          echo "无图样本 id: $IDS"
          for id in $IDS; do
            curl -s --max-time 20 -H "Authorization: Bearer $PANDASCORE_TOKEN" \
              "https://api.pandascore.co/players/$id" \
              | jq -c '{id, name, image_url}'
            sleep 1
          done
